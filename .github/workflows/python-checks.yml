name: Python syntax and template checks

on:
  push:
    branches: ["feature/database-data-browser"]
  pull_request:
    branches: ["main", "master"]

jobs:
  syntax-and-templates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install template parser
        run: python -m pip install --upgrade pip Jinja2
      - name: Compile Python files
        run: python -m compileall -q app.py
      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          files = sorted(Path("templates").glob("*.html"))
          if not files:
              raise SystemExit("No HTML templates found.")
          for path in files:
              env.parse(path.read_text(encoding="utf-8"))
              print(f"Template syntax OK: {path}")
          PY
